name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # 本项目运行时零第三方依赖（见 requirements.txt），只需要 pytest。
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Syntax check
        # 覆盖测试没有 import 到的 GUI 部分（app/ui/、app/main.py），
        # 能在不启动桌面的前提下抓出语法错误。
        run: python -m compileall -q app questions utils

      - name: Run tests
        run: python -m pytest
